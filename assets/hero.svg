<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c15"/>
      <stop offset="50%" stop-color="#0e1424"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="googleBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="50%" stop-color="#6ba4fc"/>
      <stop offset="100%" stop-color="#8ab4f8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#34A853" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#EA4335" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161f36" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f1627" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="33%" stop-color="#EA4335"/>
      <stop offset="66%" stop-color="#FBBC05"/>
      <stop offset="100%" stop-color="#34A853"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 18px; fill: #94a3b8; }
    .mono { font-family: 'SF Mono', Monaco, Consolas, 'Courier New', monospace; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
    .card-metric { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 26px; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 12px; fill: #64748b; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 11px; fill: #38bdf8; }
  </style>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bgGrad)"/>

  <!-- Subtle Matrix / Circuit Dots -->
  <g opacity="0.12" fill="#4285F4">
    <circle cx="100" cy="80" r="1.5"/><circle cx="200" cy="80" r="1.5"/><circle cx="300" cy="80" r="1.5"/><circle cx="400" cy="80" r="1.5"/><circle cx="500" cy="80" r="1.5"/><circle cx="600" cy="80" r="1.5"/><circle cx="700" cy="80" r="1.5"/><circle cx="800" cy="80" r="1.5"/><circle cx="900" cy="80" r="1.5"/><circle cx="1000" cy="80" r="1.5"/><circle cx="1100" cy="80" r="1.5"/>
    <circle cx="100" cy="160" r="1.5"/><circle cx="200" cy="160" r="1.5"/><circle cx="300" cy="160" r="1.5"/><circle cx="400" cy="160" r="1.5"/><circle cx="500" cy="160" r="1.5"/><circle cx="600" cy="160" r="1.5"/><circle cx="700" cy="160" r="1.5"/><circle cx="800" cy="160" r="1.5"/><circle cx="900" cy="160" r="1.5"/><circle cx="1000" cy="160" r="1.5"/><circle cx="1100" cy="160" r="1.5"/>
    <circle cx="100" cy="240" r="1.5"/><circle cx="200" cy="240" r="1.5"/><circle cx="300" cy="240" r="1.5"/><circle cx="400" cy="240" r="1.5"/><circle cx="500" cy="240" r="1.5"/><circle cx="600" cy="240" r="1.5"/><circle cx="700" cy="240" r="1.5"/><circle cx="800" cy="240" r="1.5"/><circle cx="900" cy="240" r="1.5"/><circle cx="1000" cy="240" r="1.5"/><circle cx="1100" cy="240" r="1.5"/>
    <circle cx="100" cy="320" r="1.5"/><circle cx="200" cy="320" r="1.5"/><circle cx="300" cy="320" r="1.5"/><circle cx="400" cy="320" r="1.5"/><circle cx="500" cy="320" r="1.5"/><circle cx="600" cy="320" r="1.5"/><circle cx="700" cy="320" r="1.5"/><circle cx="800" cy="320" r="1.5"/><circle cx="900" cy="320" r="1.5"/><circle cx="1000" cy="320" r="1.5"/><circle cx="1100" cy="320" r="1.5"/>
    <circle cx="100" cy="400" r="1.5"/><circle cx="200" cy="400" r="1.5"/><circle cx="300" cy="400" r="1.5"/><circle cx="400" cy="400" r="1.5"/><circle cx="500" cy="400" r="1.5"/><circle cx="600" cy="400" r="1.5"/><circle cx="700" cy="400" r="1.5"/><circle cx="800" cy="400" r="1.5"/><circle cx="900" cy="400" r="1.5"/><circle cx="1000" cy="400" r="1.5"/><circle cx="1100" cy="400" r="1.5"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="600" cy="180" r="300" fill="url(#glowGrad)"/>

  <!-- Top Accent Bar (Google AI Palette) -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#badgeGrad)"/>

  <!-- Antigravity Pill Badge -->
  <g transform="translate(460, 42)">
    <rect x="0" y="0" width="280" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="15" r="5" fill="#34A853"/>
    <text x="32" y="19" class="tag" font-size="12">GOOGLE ANTIGRAVITY SKILL</text>
    <rect x="200" y="7" width="66" height="16" rx="8" fill="#4285F4" fill-opacity="0.2"/>
    <text x="212" y="19" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="10" font-weight="700" fill="#93c5fd">v1.0.0</text>
  </g>

  <!-- Main Titles -->
  <g transform="translate(600, 125)" text-anchor="middle">
    <text x="0" y="0" class="title">Antigravity SEO</text>
    <text x="0" y="32" class="subtitle">Autonomous AI SEO, GEO, AEO &amp; Technical Optimization Framework</text>
  </g>

  <!-- Google Antigravity Terminal / Prompt Strip -->
  <g transform="translate(320, 185)" filter="url(#shadow)">
    <rect x="0" y="0" width="560" height="44" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Terminal dots -->
    <circle cx="18" cy="22" r="4.5" fill="#EA4335" opacity="0.8"/>
    <circle cx="32" cy="22" r="4.5" fill="#FBBC05" opacity="0.8"/>
    <circle cx="46" cy="22" r="4.5" fill="#34A853" opacity="0.8"/>
    <!-- Prompt Text -->
    <text x="68" y="27" class="mono" font-size="14" fill="#94a3b8">agy&gt; <tspan fill="#4285F4">/seo audit</tspan> <tspan fill="#f1f5f9">https://yoursite.com</tspan> <tspan fill="#34A853">--parallel-agents</tspan></text>
  </g>

  <!-- 4 Core Pillars Feature Cards -->
  <g transform="translate(80, 265)">
    <!-- Card 1: Technical SEO -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect x="0" y="0" width="240" height="150" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
      <circle cx="28" cy="28" r="14" fill="#4285F4" fill-opacity="0.15"/>
      <path d="M22 28l4 4 8-8" fill="none" stroke="#4285F4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="52" y="32" class="card-title">Technical SEO</text>
      <text x="20" y="78" class="card-metric" fill="#4285F4">100%</text>
      <text x="20" y="104" class="card-desc">Crawlability, Canonicals,</text>
      <text x="20" y="122" class="card-desc">XML Sitemaps &amp; Core Web Vitals</text>
    </g>

    <!-- Card 2: GEO & AI Citations -->
    <g transform="translate(265, 0)" filter="url(#shadow)">
      <rect x="0" y="0" width="240" height="150" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
      <circle cx="28" cy="28" r="14" fill="#34A853" fill-opacity="0.15"/>
      <circle cx="28" cy="28" r="6" fill="#34A853"/>
      <text x="52" y="32" class="card-title">GEO Engine</text>
      <text x="20" y="78" class="card-metric" fill="#34A853">AI Cited</text>
      <text x="20" y="104" class="card-desc">ChatGPT, Perplexity &amp; Gemini</text>
      <text x="20" y="122" class="card-desc">Entity Density &amp; Clean Tables</text>
    </g>

    <!-- Card 3: AEO & Answer Snippets -->
    <g transform="translate(530, 0)" filter="url(#shadow)">
      <rect x="0" y="0" width="240" height="150" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
      <circle cx="28" cy="28" r="14" fill="#FBBC05" fill-opacity="0.15"/>
      <path d="M24 23h8M24 28h6M24 33h4" stroke="#FBBC05" stroke-width="2" stroke-linecap="round"/>
      <text x="52" y="32" class="card-title">AEO Standards</text>
      <text x="20" y="78" class="card-metric" fill="#FBBC05">10-FAQ</text>
      <text x="20" y="104" class="card-desc">Google AI Overviews &amp; Snippets</text>
      <text x="20" y="122" class="card-desc">Upfront Direct Factual Answers</text>
    </g>

    <!-- Card 4: Multi-Agent Parallel -->
    <g transform="translate(795, 0)" filter="url(#shadow)">
      <rect x="0" y="0" width="245" height="150" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1"/>
      <circle cx="28" cy="28" r="14" fill="#EA4335" fill-opacity="0.15"/>
      <circle cx="24" cy="28" r="3" fill="#EA4335"/>
      <circle cx="32" cy="28" r="3" fill="#EA4335"/>
      <text x="52" y="32" class="card-title">19 Gemini Agents</text>
      <text x="20" y="78" class="card-metric" fill="#EA4335">Parallel</text>
      <text x="20" y="104" class="card-desc">Specialists Fan Out Simultaneously</text>
      <text x="20" y="122" class="card-desc">Audits Completed in Minutes</text>
    </g>
  </g>

  <!-- Bottom Attribution Line -->
  <g transform="translate(600, 455)" text-anchor="middle">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="12" fill="#475569">Engineered for Google Antigravity · MIT Licensed · Open Source</text>
  </g>
</svg>
