name: Bug Report
description: Create a report to help us improve Antigravity SEO
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the details below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command Executed
      description: What exact command or prompt did you use? (e.g., `/seo audit https://mysite.com`)
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Terminal Output / Error Logs
      description: Paste any error messages, tracebacks, or output here.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating System, Python version, and Antigravity version.
      placeholder: Windows 11, Python 3.11, Antigravity 2.0
    validations:
      required: true
