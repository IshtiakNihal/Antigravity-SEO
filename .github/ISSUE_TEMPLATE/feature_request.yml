name: Feature Request
description: Suggest an idea or enhancement for Antigravity SEO
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Antigravity SEO even better? We'd love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem is. (e.g. "I'm always frustrated when...")
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context or Examples
      description: Add any mockups, CLI syntax examples, or references from other search tools.

